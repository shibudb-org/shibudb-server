name: test-integration-linux-targets

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-packages:
    name: Build ${{ matrix.package }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: deb
            arch: amd64
            runner: ubuntu-latest
            script: build-linux-deb-amd64.sh
            artifact-name: linux-deb-amd64
            artifact-path: build/linux/deb/amd64
          - package: rpm
            arch: amd64
            runner: ubuntu-latest
            script: build-linux-rpm-amd64.sh
            artifact-name: linux-rpm-amd64
            artifact-path: build/linux/rpm/amd64
          - package: deb
            arch: arm64
            runner: ubuntu-22.04-arm
            script: build-linux-deb-arm64.sh
            artifact-name: linux-deb-arm64
            artifact-path: build/linux/deb/arm64
          - package: rpm
            arch: arm64
            runner: ubuntu-22.04-arm
            script: build-linux-rpm-arm64.sh
            artifact-name: linux-rpm-arm64
            artifact-path: build/linux/rpm/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install RPM build tooling
        if: matrix.package == 'rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Ensure build scripts are executable
        run: chmod +x build-*.sh

      - name: Build package
        run: ./${{ matrix.script }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  install-test-deb:
    name: Install DEB on ${{ matrix.distro }} ${{ matrix.arch }}
    needs: build-linux-packages
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-deb-amd64
            experimental: false
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-deb-amd64
            experimental: false
          - distro: debian-12
            image: debian:12
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-deb-amd64
            experimental: false
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: linux-deb-arm64
            experimental: false
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: linux-deb-arm64
            experimental: false
          - distro: debian-12
            image: debian:12
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: linux-deb-arm64
            experimental: false

    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: packages

      - name: Install package
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates libc6 libstdc++6 libgomp1 libopenblas0 bash curl tar gzip
          # gcc/g++ are required to build the CGO-based E2E test binary (go-faiss).
          apt-get install -y gcc g++
          apt-get install -y ./packages/*.deb

      - name: Smoke and integration test ShibuDB
        run: |
          set -eu

          install_go() {
            go_version="1.24.0"
            case "$(uname -m)" in
              x86_64) go_arch="amd64" ;;
              aarch64) go_arch="arm64" ;;
              *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "https://go.dev/dl/go${go_version}.linux-${go_arch}.tar.gz" -o /tmp/go.tar.gz
            rm -rf /tmp/go
            mkdir -p /tmp/go
            tar -C /tmp/go --strip-components=1 -xzf /tmp/go.tar.gz
            export PATH="/tmp/go/bin:$PATH"
            go version
          }

          download_source() {
            rm -rf /tmp/shibudb-source
            mkdir -p /tmp/shibudb-source
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" -o /tmp/shibudb-source.tar.gz
            tar -C /tmp/shibudb-source --strip-components=1 -xzf /tmp/shibudb-source.tar.gz
          }

          install_go
          download_source

          shibudb --version
          ldd /usr/local/bin/shibudb

          mkdir -p /tmp/shibudb-data
          shibudb run \
            --data-dir /tmp/shibudb-data \
            --admin-user admin \
            --admin-password admin \
            --port 4444 \
            --management-port 5444 \
            > /tmp/shibudb.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/4444' 2>/dev/null; then
              printf 'exit\n' | shibudb connect --username admin --password admin --port 4444
              bash /tmp/shibudb-source/scripts/run-e2e-installed.sh /tmp/shibudb-source
              exit 0
            fi
            sleep 1
          done

          cat /tmp/shibudb.log
          exit 1

  install-test-rpm:
    name: Install RPM on ${{ matrix.distro }} ${{ matrix.arch }}
    needs: build-linux-packages
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rocky-9
            image: rockylinux:9
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-rpm-amd64
            experimental: false
          - distro: almalinux-9
            image: almalinux:9
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-rpm-amd64
            experimental: false
          - distro: fedora-latest
            image: fedora:latest
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-rpm-amd64
            experimental: false
          - distro: amazonlinux-2023
            image: amazonlinux:2023
            arch: amd64
            runner: ubuntu-latest
            artifact-name: linux-rpm-amd64
            experimental: false
          - distro: rocky-9
            image: rockylinux:9
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: linux-rpm-arm64
            experimental: false
          - distro: almalinux-9
            image: almalinux:9
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: linux-rpm-arm64
            experimental: false
          - distro: amazonlinux-2023
            image: amazonlinux:2023
            arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: linux-rpm-arm64
            experimental: false

    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: packages

      - name: Install package
        run: |
          set -eu

          # gcc/gcc-c++ are required to build the CGO-based E2E test binary (go-faiss).
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y gcc gcc-c++ libstdc++ libgomp openblas bash tar gzip
            if ! command -v curl >/dev/null 2>&1; then
              dnf install -y curl || dnf install -y --allowerasing curl
            fi
            dnf install -y ./packages/*.rpm
          else
            yum install -y gcc gcc-c++ libstdc++ libgomp openblas bash tar gzip curl
            yum install -y ./packages/*.rpm
          fi

      - name: Smoke and integration test ShibuDB
        run: |
          set -eu

          install_go() {
            go_version="1.24.0"
            case "$(uname -m)" in
              x86_64) go_arch="amd64" ;;
              aarch64) go_arch="arm64" ;;
              *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "https://go.dev/dl/go${go_version}.linux-${go_arch}.tar.gz" -o /tmp/go.tar.gz
            rm -rf /tmp/go
            mkdir -p /tmp/go
            tar -C /tmp/go --strip-components=1 -xzf /tmp/go.tar.gz
            export PATH="/tmp/go/bin:$PATH"
            go version
          }

          download_source() {
            rm -rf /tmp/shibudb-source
            mkdir -p /tmp/shibudb-source
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" -o /tmp/shibudb-source.tar.gz
            tar -C /tmp/shibudb-source --strip-components=1 -xzf /tmp/shibudb-source.tar.gz
          }

          install_go
          download_source

          shibudb --version
          ldd /usr/local/bin/shibudb

          mkdir -p /tmp/shibudb-data
          shibudb run \
            --data-dir /tmp/shibudb-data \
            --admin-user admin \
            --admin-password admin \
            --port 4444 \
            --management-port 5444 \
            > /tmp/shibudb.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/4444' 2>/dev/null; then
              printf 'exit\n' | shibudb connect --username admin --password admin --port 4444
              bash /tmp/shibudb-source/scripts/run-e2e-installed.sh /tmp/shibudb-source
              exit 0
            fi
            sleep 1
          done

          cat /tmp/shibudb.log
          exit 1

  install-test-source:
    name: Install From Source on ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-20.04
            image: ubuntu:20.04
            arch: amd64
            runner: ubuntu-latest
          - distro: debian-11
            image: debian:11
            arch: amd64
            runner: ubuntu-latest
          - distro: rocky-8
            image: rockylinux:8
            arch: amd64
            runner: ubuntu-latest
          - distro: amazonlinux-2
            image: amazonlinux:2
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            arch: amd64
            runner: ubuntu-latest
          - distro: debian-12
            image: debian:12
            arch: amd64
            runner: ubuntu-latest
          - distro: rocky-9
            image: rockylinux:9
            arch: amd64
            runner: ubuntu-latest
          - distro: almalinux-9
            image: almalinux:9
            arch: amd64
            runner: ubuntu-latest
          - distro: fedora-latest
            image: fedora:latest
            arch: amd64
            runner: ubuntu-latest
          - distro: amazonlinux-2023
            image: amazonlinux:2023
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu-20.04
            image: ubuntu:20.04
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: debian-11
            image: debian:11
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: rocky-8
            image: rockylinux:8
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: amazonlinux-2
            image: amazonlinux:2
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: debian-12
            image: debian:12
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: rocky-9
            image: rockylinux:9
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: almalinux-9
            image: almalinux:9
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: fedora-latest
            image: fedora:latest
            arch: arm64
            runner: ubuntu-22.04-arm
          - distro: amazonlinux-2023
            image: amazonlinux:2023
            arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, smoke, and integration test from source
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail

              install_go() {
                go_version="1.24.0"
                case "$(uname -m)" in
                  x86_64) go_arch="amd64" ;;
                  aarch64) go_arch="arm64" ;;
                  *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                esac
                curl -fsSL "https://go.dev/dl/go${go_version}.linux-${go_arch}.tar.gz" -o /tmp/go.tar.gz
                rm -rf /tmp/go
                mkdir -p /tmp/go
                tar -C /tmp/go --strip-components=1 -xzf /tmp/go.tar.gz
                export PATH="/tmp/go/bin:$PATH"
                go version
              }

              chmod +x scripts/install-linux.sh
              ./scripts/install-linux.sh --source /work
              install_go

              shibudb --version
              ldd /usr/local/bin/shibudb

              mkdir -p /tmp/shibudb-data
              shibudb run \
                --data-dir /tmp/shibudb-data \
                --admin-user admin \
                --admin-password admin \
                --port 4444 \
                --management-port 5444 \
                > /tmp/shibudb.log 2>&1 &
              server_pid=$!

              cleanup() {
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
              }
              trap cleanup EXIT

              for _ in $(seq 1 30); do
                if timeout 1 bash -c "</dev/tcp/127.0.0.1/4444" 2>/dev/null; then
                  printf "exit\n" | shibudb connect --username admin --password admin --port 4444
                  bash scripts/run-e2e-installed.sh /work
                  exit 0
                fi
                sleep 1
              done

              cat /tmp/shibudb.log
              exit 1
            '
